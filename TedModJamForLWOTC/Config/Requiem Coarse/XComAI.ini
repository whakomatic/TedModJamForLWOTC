[XComGame.XGAIBehavior]

; Community Highlander issue #1369 made bTestTargetEffectsApply accept a multi target effect only
; when its DamageTypes array is not empty. None of the effects on AHWAltarDesolate declares a damage type.
; Adding a damage type to the effect is more complex than a quick ini edit that the altar doesnt really need anyway.
; The Cyberdisc changes as well for the same reasons
-AoEProfiles=( Profile=AHWAltarDesolateProfile, Ability=AHWAltarDesolate, MinTargets=1, bTestTargetEffectsApply=true)
-AoEProfiles=( Profile=AHWDeathBlossomProfile, Ability=AHWCyberdiscDeathBlossom, MinTargets=1, bTestTargetEffectsApply=true)

+AoEProfiles=(Profile=AHWAltarDesolateProfile, Ability=AHWAltarDesolate, MinTargets=1, bTestTargetEffectsApply=false)
+AoEProfiles=(Profile=AHWDeathBlossomProfile, Ability=AHWCyberdiscDeathBlossom, MinTargets=1, bTestTargetEffectsApply=false)
